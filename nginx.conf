# Request paths carry long-lived secrets (/{user_key}/... for native clients,
# signed /media/ tokens), so access logs record the method and status only.
log_format curatio_redacted '$remote_addr [$time_local] "$request_method" '
                            '$status $body_bytes_sent $request_time';

upstream curatio_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/access.log curatio_redacted;
    # JSON APIs only; a large watch-history import is the biggest legitimate body.
    client_max_body_size 25m;

    # Production deployments should terminate TLS and redirect HTTP to HTTPS.
    # Uncomment the next line after configuring the HTTPS server block below.
    # return 301 https://$host$request_uri;

    # Latency-sensitive private JSON. Keep buffering on (the complete response is
    # small enough to send at once), reuse the upstream connection, and fail a
    # stalled request promptly. Do not proxy_cache this profile-authenticated URL.
    location ~ ^/(?:account|[^/]+)/api/details$ {
        proxy_pass http://curatio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://curatio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — builds can run for hours
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Media playback (byte proxy + probes): stream, don't buffer. nginx's
    # default proxy buffering would spool multi-GB media responses to disk,
    # delaying the first byte and holding backend proxy slots open for data
    # the viewer may never watch.
    location /account/api/playback/ {
        proxy_pass http://curatio_app;
        # Reuse upstream connections: a playing browser sends a Range or HLS
        # segment request every few seconds.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;

        # A stalled upstream should be cut, not held open for a day.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket support for build log streaming
    location /admin/ws/ {
        proxy_pass http://curatio_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WS alive during long builds
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

