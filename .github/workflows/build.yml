name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/test_db
        SKIP_API_VALIDATION: "true"
        TMDB_API_KEY: test_key
        GEMINI_API_KEY: test_key
        MASTER_PASSWORD: test_password_long_enough
        SECRET_KEY: test_secret_key_at_least_32_chars_long
        BASE_URL: http://localhost:8000
      run: |
        pytest -q tests/test_playback_remux.py tests/test_playback_probe.py tests/test_playback_proxy_head.py
        pytest tests/ -q
    

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install black==24.1.1 ruff==0.1.14 mypy==1.8.0
    
    - name: Run Black
      run: black --check app/ workers/ tests/
    
    - name: Run Ruff
      run: ruff check app/ workers/ tests/
    
    - name: Run MyPy
      run: mypy app/ --ignore-missing-imports

    # Report-only until the FastAPI/Starlette upgrade lands: starlette 0.46.2,
    # orjson and python-dotenv have published advisories.
    - name: Audit dependencies
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run frontend tests
      run: npm test

    - name: Build production dashboard
      run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install FFmpeg and browser runtimes
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        npx playwright install --with-deps ${{ matrix.browser }}

    - name: Run ${{ matrix.browser }} playback smoke test
      run: npm run test:browser -- --project=${{ matrix.browser }}

    - name: Upload browser traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playback-${{ matrix.browser }}-traces
        path: test-results/
        if-no-files-found: ignore

  # Two images for amd64 and arm64: `latest` (PostgreSQL in its own container,
  # see deploy/) and `aio` (PostgreSQL built in, for Unraid).
  build:
    runs-on: ubuntu-latest
    needs: [test, lint, frontend, browser-smoke]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Short commit
      id: rev
      run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

    - name: Build and push the standard image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          CURATIO_GIT_REVISION=${{ github.sha }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.rev.outputs.short }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Build and push the all-in-one image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.aio
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.rev.outputs.short }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:aio
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:aio-sha-${{ steps.rev.outputs.short }}
